<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PowerPoint のショートカットキーを、お手本のスライドを再現しながら覚える練習アプリ。ブラウザですぐに使えます。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PowerMangai - PowerPoint ショートカット練習">
  <meta property="og:description" content="お手本のスライドをショートカットキーだけで再現して、PowerPoint の操作を覚えよう。">
  <meta name="twitter:card" content="summary">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PowerMangai - ショートカット練習</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="titlebar">
    <span class="app-name">PowerMangai</span>
    <span id="doc-title">無題</span>
    <span class="spacer"></span>
    <span id="stats" aria-live="off"></span>
  </header>

  <nav id="ribbon" aria-label="リボン">
    <div id="ribbon-tabs"></div>
    <div id="ribbon-hint">Alt キーを押して離すと KeyTips（キー操作のガイド）が表示されます ／ F1: ショートカット一覧 ／ F8: 課題を選ぶ</div>
  </nav>

  <main id="workspace">
    <aside id="thumbs" aria-label="スライド一覧"></aside>
    <aside id="outline" aria-label="アウトライン" hidden></aside>
    <div id="center">
      <section id="stage" aria-label="スライド編集">
        <div id="canvas-wrap">
          <canvas id="slide-canvas"></canvas>
          <canvas id="overlay-canvas"></canvas>
          <div id="text-box"><div id="text-editor" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="テキスト編集"></div></div>
        </div>
      </section>
      <section id="notes-pane" aria-label="ノート">
        <textarea id="notes" spellcheck="false" placeholder="クリックしてノートを入力（F6 でここへ移動）"></textarea>
      </section>
    </div>
    <section id="sorter" aria-label="スライド一覧表示" hidden></section>
    <aside id="practice" aria-label="練習">
      <h2 id="practice-title">練習モード</h2>
      <div id="practice-meta"></div>
      <figure id="target-figure">
        <figcaption id="target-caption">お手本</figcaption>
        <img id="target-image" alt="お手本のスライド">
      </figure>
      <section id="hints">
        <h3>ヒント</h3>
        <ol id="hint-list"></ol>
      </section>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="status-slide"></span>
    <span id="status-pane"></span>
    <span id="status-selection"></span>
    <span id="status-view"></span>
    <span class="spacer"></span>
    <span id="status-message" role="status"></span>
  </footer>

  <div id="keylog" aria-live="polite"></div>
  <div id="keytips" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" role="alert" hidden></div>
  <div id="print-root" hidden></div>
  <div id="slideshow" hidden>
    <div id="show-main"><canvas id="show-canvas"></canvas><div id="show-cover"></div></div>
    <aside id="presenter" hidden>
      <div class="pv-head"><span id="pv-timer">0:00</span><span id="pv-count"></span></div>
      <div class="pv-label">次のスライド</div>
      <canvas id="pv-next"></canvas>
      <div class="pv-label">ノート</div>
      <div id="pv-notes"></div>
    </aside>
  </div>

  <script type="module" src="ui/app.js"></script>
</body>
</html>
