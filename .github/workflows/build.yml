# プッシュのたびにテストを実行し、Windows / macOS / Linux のデスクトップ アプリをビルドする。
# ビルドしたインストーラーは各実行の「Artifacts」からダウンロードできる。
# v から始まるタグ（例: v0.2.0）をプッシュすると、GitHub のリリースにも添付する。
name: Build desktop app

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'リリースする場合のタグ（例: v0.1.0）。空ならビルドだけ'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: テスト
    # 同じリポジトリのブランチの PR は push で実行済みなので、フォークからの PR だけ実行する
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 単体テスト
        run: npm test
      - name: E2E テスト用の Chromium・日本語フォント・仮想ディスプレイ
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-ipafont-gothic xvfb
      - name: E2E テスト
        run: npm run test:e2e
      - name: Electron の起動確認
        run: xvfb-run -a npm run smoke

  build:
    name: ビルド (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
          - name: macOS
            os: macos-latest
            script: dist:mac
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
            files: |
              dist/*.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ビルド
        run: npm run ${{ matrix.script }}
        env:
          # コード署名はしない（証明書を設定したらこの行を外す）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: ビルドしたアプリの起動確認
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          PMG_APP_PATH="$PWD/dist/linux-unpacked/powermangai" xvfb-run -a npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: PowerMangai-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  deploy-web:
    name: Web 版の公開（Cloudflare Pages）
    # テストが通ったら公開する。main は本番、それ以外のブランチはプレビュー用の URL に公開する
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 設定の確認
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が設定されていないため、Web 版の公開をスキップしました（README の「Web 版の公開」を参照）"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
      - name: プロジェクトの作成（初回のみ）
        if: steps.check.outputs.enabled == 'true'
        run: npx --yes wrangler@3 pages project create powermangai --production-branch=main || true
      - name: 公開
        if: steps.check.outputs.enabled == 'true'
        run: npx --yes wrangler@3 pages deploy src --project-name=powermangai --branch="${GITHUB_REF_NAME}" --commit-dirty=true

  release:
    name: リリースに添付
    # v から始まるタグのプッシュ、または手動実行で release_tag（v から始まる）を指定したとき
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # 手動実行のときは、ビルドしたコミットにタグを作ってリリースする
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
